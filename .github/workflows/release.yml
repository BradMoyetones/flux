name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Tauri
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            cgo: 1
            binary-name: whatsapp-sidecar-aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            cgo: 1
            binary-name: whatsapp-sidecar-x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            goos: linux
            goarch: amd64
            cgo: 1
            binary-name: whatsapp-sidecar-x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            goos: windows
            goarch: amd64
            cgo: 1
            binary-name: whatsapp-sidecar-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'apps/desktop/src-tauri/sidecar/go.mod'
          cache-dependency-path: apps/desktop/src-tauri/sidecar/go.sum

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev gcc build-essential

      - name: Enable Windows CGO
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # Añadir MinGW-w64 preinstalado en los runners de GitHub al PATH
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build Go Sidecar
        shell: bash
        working-directory: apps/desktop/src-tauri/sidecar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p ../binaries
          go mod tidy
          go build -o ../binaries/${{ matrix.binary-name }} .
          echo "✅ Sidecar compilado exitosamente: ${{ matrix.binary-name }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @flux/api
        run: pnpm --filter @flux/api build

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          if [ -f apps/desktop/releases/latest.md ]; then
            # Extraer el YAML frontmatter del archivo para que la Release de GitHub quede limpia
            awk 'NR==1 && /^---$/ {in_fm=1; next} in_fm && /^---$/ {in_fm=0; next} !in_fm {print}' apps/desktop/releases/latest.md >> "$GITHUB_OUTPUT"
          else
            echo "Nueva versión de Flux disponible." >> "$GITHUB_OUTPUT"
          fi
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Flux v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: ${{ matrix.args }}