name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @flux/api
        run: pnpm --filter @flux/api build

      - name: Build @flux/ui
        run: pnpm --filter @flux/ui build

      - name: Unit tests
        run: pnpm --filter @flux/desktop test

  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies (Tauri)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Create sidecar placeholder
        run: |
          mkdir -p ../dist binaries
          touch binaries/whatsapp-sidecar-x86_64-unknown-linux-gnu

      - name: Tests
        run: cargo test --lib